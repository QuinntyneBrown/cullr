<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <a class="topbar__brand" href="../sign-in/default.html"><svg class="icon icon--lg" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 6-6 2 2-6z"/></svg>Cullr</a>
</header>
<main id="main" class="auth-layout">
  <div class="card auth-card">
    <h1>Forgot your password?</h1>
    <div class="alert alert--danger form-summary" style="margin-top: var(--space-4);" role="alert"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 4.3 2.7 18a1 1 0 0 0 .9 1.5h17a1 1 0 0 0 .9-1.5L13.7 4.3a1 1 0 0 0-1.7 0z"/></svg><div class="alert__body"><div class="alert__title">Fix 1 error to continue</div><ul style="margin:0; padding-left:1.2em;"><li><a href="#email">Enter an email address like name@example.com</a></li></ul></div></div>
    <form class="stack" style="margin-top: var(--space-4);">
      <label class="field"><span class="field__label">Email</span><input class="input" id="email" type="email" value="jordan@" aria-invalid="true" aria-describedby="email-error"><span class="field__error" id="email-error">Enter an email address like name@example.com</span></label>
      <button class="btn btn--primary btn--block" type="submit">Send reset link</button>
    </form>
  </div>
</main>
