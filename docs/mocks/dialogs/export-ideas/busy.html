<body>
<a class="skip-link" href="#main">Skip to content</a>
<div inert aria-hidden="true">
  <header class="topbar">
    <a class="topbar__brand" href="../../pages/today/default.html"><svg class="icon icon--lg" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 6-6 2 2-6z"/></svg>Cullr</a>
    <span class="topbar__spacer"></span>
    <span class="avatar avatar--sm">JR</span>
  </header>
  <main id="main" class="container">
    <div class="page-header"><div><h1>Settings</h1></div></div>
    <p class="subtitle">Capture reminders, limits and export</p>
  </main>
</div>
<div class="backdrop"></div>
<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" aria-describedby="dlg-desc" data-dismiss-on-escape>
  <div class="dialog__panel">
    <div class="dialog__header">
      <div class="dialog__icon dialog__icon--info" aria-hidden="true"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></div>
      <div style="flex:1;">
        <h2 class="dialog__title" id="dlg-title">Export ideas</h2>
        <p id="dlg-desc" class="text-muted" style="margin-top: var(--space-1);">Preparing your export.</p>
      </div>
      <button class="btn btn--ghost btn--icon" type="button" aria-label="Close"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="dialog__body stack">
      <fieldset>
        <legend>Include</legend>
        <label class="choice"><input type="checkbox" checked><span class="choice__text">Active ideas<small>214 ideas logged, critiqued or curated</small></span></label>
        <label class="choice"><input type="checkbox" checked><span class="choice__text">Archived ideas<small>3 archived or culled ideas</small></span></label>
        <label class="choice"><input type="checkbox"><span class="choice__text">Critique notes<small>Adds a column per idea</small></span></label>
      </fieldset>
    </div>
    <div class="dialog__footer">
      <button class="btn" type="button" disabled>Cancel</button><button class="btn btn--primary" type="button" aria-busy="true">Preparing…</button>
    </div>
  </div>
</div>
