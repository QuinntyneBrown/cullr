<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="topbar">
  <a class="topbar__brand" href="../../pages/today/default.html"><svg class="icon icon--lg" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 6-6 2 2-6z"/></svg>Cullr</a>
  <span class="topbar__spacer"></span>
  <span class="avatar avatar--sm" aria-hidden="true">JR</span>
</header>
<main id="main" class="container">

  <div class="card"><p>Porch Light &middot; Toronto &amp; GTA</p></div>
</main>
<div class="toast-region" role="status" aria-live="polite">
  <div class="toast toast--info">
    <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 11h1v5h1"/></svg>
    <div class="toast__body">
      <div class="toast__title">Added to Curated</div>
      <div class="toast__text">“Porch Light” now shows on the Curated page as best of today.</div>
      <button class="toast__action" type="button">View curated</button>
    </div>
    <button class="close" type="button" aria-label="Dismiss"><svg class="icon icon--sm" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span class="toast__progress" aria-hidden="true"></span>
  </div>
</div>
<p class="mock-note" style="bottom: 9rem; right: 1rem;">Auto-dismisses after 8 s; the timer pauses on hover and focus.</p>
